repos:
  # general checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer

  # frontend checks
  - repo: local
    hooks:
      - id: eslint
        name: ESLint
        entry: npx --prefix frontend eslint --fix
        language: system
        files: ^frontend/.*
        types_or: [javascript, jsx, ts, tsx]
        pass_filenames: true

      - id: prettier
        name: Prettier
        entry: npx --prefix frontend prettier --write
        language: system
        files: ^frontend/.*
        types_or: [javascript, jsx, ts, tsx, json, css, markdown]
        pass_filenames: true

  # backend checks
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version
    rev: v0.12.2
    hooks:
      - id: ruff-check
        # arg[1] keeps all fixes in one commit instead of having a separate commit for "apply ruff fixes"
        args: [--fix, --exit-non-zero-on-fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/
